# Turbofit Hermes skill distribution
name: turbofit
version: "2.0.0"
description: >-
  Hardware-aware adaptive Hermes runtime using portable Turbofiles,
  Turbohaul Manager v0.7 local residency, stable auto/active role routes,
  evidence-backed promotion, and external-GPU-first pressure handling.
author: SouthpawIN
license: MIT
homepage: https://github.com/SouthpawIN/turbofit
repo: https://github.com/SouthpawIN/turbofit
hermes_requires: ">=0.12.0"

# Provider credentials are configured through Hermes/provider setup and are never
# embedded in Turbofiles or distribution artifacts.
env_requires: []

distribution_owned:
  - SKILL.md
  - README.md
  - distribution.yaml
  - assets/
  - benchmarks/
  - docs/
  - research/
  - runtime-profiles/
  - src/turbofit_runtime/
  - scripts/turbofit-runtime
  - scripts/turbofit-controller
  - scripts/install-controller-service
  - scripts/turbofit-runtime-recommend
  - scripts/turbofit-gateway.py
  - scripts/migrate-runtime-profiles
  - scripts/matrix-benchmark.py
  - scripts/generate-configuration-matrix
  - scripts/adaptive-acceptance
  - scripts/controlled-pressure-acceptance
  - scripts/vram-pressure-acceptance
  - scripts/release-check
  - references/results/
  - references/model-catalog.json
  - references/configuration-matrix.json

# Installation does not start launchers, watchers, or modify provider credentials.
# Runtime activation remains an explicit Turbofile selection.
post_install: []
