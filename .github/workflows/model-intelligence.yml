name: Model intelligence

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: model-intelligence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml
      - name: Collect public model and benchmark intelligence
        env:
          PYTHONPATH: .
        run: |
          python research/discover_huggingface.py
          python research/discover_model_news.py --url https://huggingface.co/blog/feed.xml
          python research/discover_api_models.py --provider openrouter --url https://openrouter.ai/api/v1/models
          python research/discover_external_benchmarks.py
          python research/render_external_benchmarks.py
          PYTHONPATH=src:. scripts/turbofit-discovery-queue
      - name: Validate normalized evidence
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest tests/test_research_candidates.py tests/test_external_benchmarks.py -q -o 'addopts='
          git diff --check
      - name: Publish a reviewable update PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- research/candidates.json research/benchmark-queue.json research/external-benchmarks.json references/external-benchmarks.md; then
            echo "No intelligence changes."
            exit 0
          fi
          branch=automation/model-intelligence
          git checkout -B "$branch" origin/main
          git add research/candidates.json research/benchmark-queue.json research/external-benchmarks.json references/external-benchmarks.md
          git config user.name "turbofit-model-intelligence"
          git config user.email "turbofit-model-intelligence@users.noreply.github.com"
          git commit -m "chore: refresh model intelligence"
          git push --force-with-lease origin "$branch"
          gh pr view "$branch" --json url >/dev/null 2>&1 || gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: refresh model intelligence" \
            --body "Automated public-source candidate, model-news, provider-catalog, and DeepSWE evidence refresh. Review is required; this workflow cannot promote runtime configurations."
