name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest pyyaml
      - run: chmod +x scripts/release-check scripts/adaptive-acceptance
      - run: scripts/release-check

  # The real gate is host-bound by design and must run on an explicitly
  # provisioned GPU runner with Turbohaul Manager v0.7. It is never replaced
  # by the simulated CI result.
